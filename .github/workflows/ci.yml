name: CI

on:
  push:
    branches: [main, clean-start]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check server
        run: node_modules/.bin/tsc --noEmit --project server/tsconfig.json

      - name: Type-check client
        run: node_modules/.bin/tsc --noEmit --project client/tsconfig.json

      - name: Server unit tests
        run: npm run test --workspace=server

  cypress:
    name: Cypress Component Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress component tests
        run: npm run cy:run --workspace=client
