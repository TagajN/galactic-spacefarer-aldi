services:

  # ── API server ──────────────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    environment:
      PORT: 4005
      JWT_SECRET: ${JWT_SECRET:-galactic-super-secret-change-in-prod}
      DB_PATH: /app/data/galactic.db
      # Optional SMTP — leave blank to skip email sending
      SMTP_HOST:   ${SMTP_HOST:-}
      SMTP_PORT:   ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER:   ${SMTP_USER:-}
      SMTP_PASS:   ${SMTP_PASS:-}
      SMTP_FROM:   ${SMTP_FROM:-Galactic HQ <noreply@galactic.space>}
      # Allow requests from the client container via nginx
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - db_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4005/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      # Expose directly for local API testing / Insomnia / Postman
      - "4005:4005"

  # ── React client (nginx) ────────────────────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  db_data:
    driver: local
